<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>AOAI</title>

<style>

body{
  margin:0;
  font-family:sans-serif;
  background:white;
}

.topbar{
  height:60px;
  display:flex;
  justify-content:flex-end;
  align-items:center;
  padding:0 20px;
}

.topbar a{
  text-decoration:none;
  color:#444;
  font-size:14px;
}

.main{
  height:80vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.logo{
  font-size:72px;
  font-weight:900;
  margin-bottom:30px;
}

.logo span{
  color:#4285F4;
}

.search-box{
  width:90%;
  max-width:700px;
  position:relative;
}

.search-input{
  width:100%;
  height:58px;
  border-radius:999px;
  border:1px solid #ddd;
  padding:0 70px 0 20px;
  font-size:18px;
}

.send-btn{
  position:absolute;
  right:8px;
  top:8px;
  width:42px;
  height:42px;
  border:none;
  border-radius:50%;
  background:#4285F4;
  color:white;
  cursor:pointer;
}

.chat{
  width:90%;
  max-width:760px;
  margin-top:30px;
}

.msg{
  background:#f3f4f6;
  padding:16px;
  border-radius:18px;
}

.footer{
  text-align:center;
  padding:20px;
  color:#777;
  font-size:12px;
}

</style>
</head>

<body>

<div class="topbar">
  <a href="/board.html">자유게시판</a>
</div>

<div class="main">

  <div class="logo">
    AO<span>AI</span>
  </div>

  <div class="search-box">

    <input
      type="text"
      id="in"
      class="search-input"
      placeholder="무엇이든 물어보세요..."
    >

    <button class="send-btn" id="go">
      ▶
    </button>

  </div>

  <div class="chat" id="chat">
    <div class="msg">
      AOAI 시스템 준비 완료
    </div>
  </div>

</div>

<div class="footer">
  Privacy focused AI platform
</div>

<script>

const chat = document.getElementById('chat');
const input = document.getElementById('in');
const btn = document.getElementById('go');

function add(text){

  const d=document.createElement('div');

  d.className='msg';

  d.textContent=text;

  chat.appendChild(d);

}

async function send(){

  const t=input.value.trim();

  if(!t) return;

  input.value='';

  add("생각 중...");

  try{

    const res = await fetch(
      "https://api.aiofeveryone.com/v1/chat",
      {
        method:'POST',
        headers:{
          'Content-Type':'application/json'
        },
        body:JSON.stringify({
          userText:t
        })
      }
    );

    const data = await res.json();

    chat.lastChild.textContent =
      data.finalText || "응답 없음";

  }catch(e){

    chat.lastChild.textContent =
      "서버 연결 오류";

  }

}

btn.onclick=send;

input.onkeydown=e=>{
  if(e.key==='Enter') send();
};

</script>

</body>
</html>
