<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0F19" />

  <title>aiofeveryone - The Living AI Network</title>
  <meta name="description" content="aiofeveryone — 누구나 쉽게 쓰는 AI. 앱/홈페이지/도구를 한 곳에서." />
  <meta name="robots" content="index,follow" />

  <style>
    :root{
      --bg:#0B0F19;
      --panel:#0F172A;
      --text:#E5E7EB;
      --muted:#94A3B8;
      --primary:#60A5FA;
      --line:rgba(255,255,255,.08);
      --radius:16px;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
      --sans: system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans KR",Arial,sans-serif;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; margin:0; background:var(--bg); color:var(--text); font-family:var(--sans); overflow:hidden; }

    .app{ height:100vh; display:grid; grid-template-columns: 280px 1fr; }

    /* Sidebar */
    .sidebar{ border-right:1px solid var(--line); padding:16px; display:flex; flex-direction:column; background:rgba(255,255,255,.01); }
    .logo-box{ display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
    .logo{ width:34px; height:34px; background:var(--primary); color:var(--bg); border-radius:8px; display:grid; place-items:center; font-weight:900; font-size: 14px; }
    .logo-text { font-weight: 800; font-size: 18px; letter-spacing: -0.5px; }

    .sb-section{ margin-bottom:24px; flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .sb-title{ color:var(--muted); font-size:12px; margin-bottom:12px; text-transform:uppercase; letter-spacing:1px; }

    #historyList { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
    .history-item{ padding:10px; border-radius:8px; cursor:pointer; transition:0.2s; font-size:13px; display:flex; align-items:center; gap:8px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .history-item:hover{ background:rgba(255,255,255,0.05); color: var(--text); }
    .history-item.active { background: rgba(96,165,250,0.1); color: var(--primary); }
    .dot{ width:6px; height:6px; border-radius:50%; background:var(--primary); flex-shrink: 0; }

    /* Main Chat Area */
    .main{ display:flex; flex-direction:column; height:100vh; position:relative; }
    .topbar{ height:60px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; padding:0 24px; background:rgba(15,23,42,0.8); backdrop-filter:blur(10px); }
    .topbar-logo { display: flex; align-items: center; gap: 8px; font-weight: 900; letter-spacing: 1px; }
    .topbar-icon { width: 24px; height: 24px; border-radius: 4px; background: var(--primary); color: var(--bg); display: grid; place-items: center; font-size: 10px; }
    .status-pill{ font-size:11px; padding:4px 10px; border-radius:20px; background:rgba(96,165,250,0.1); border:1px solid rgba(96,165,250,0.2); color:var(--primary); }

    .chat-container{ flex:1; overflow-y:auto; padding:24px; display:flex; flex-direction:column; gap:20px; scroll-behavior: smooth; }
    .msg{ max-width:80%; padding:14px 18px; border-radius:18px; line-height:1.6; font-size:15px; position:relative; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
    .msg.user{ align-self: flex-end; background:var(--primary); color:var(--bg); font-weight:500; border-bottom-right-radius:4px; }
    .msg.ai{ align-self: flex-start; background:rgba(255,255,255,0.05); border:1px solid var(--line); border-bottom-left-radius:4px; }
    .msg.system{ align-self:center; font-size:12px; color:var(--muted); background:transparent; border:none; padding:4px; }

    /* Composer */
    .composer-wrap{ padding:20px 24px 30px; padding-bottom: calc(30px + env(safe-area-inset-bottom, 0px)); background:linear-gradient(0deg, var(--bg) 0%, transparent 100%); }
    .composer-box{ max-width:900px; margin:0 auto; position:relative; }
    .composer{ display:flex; align-items:center; gap:12px; background:rgba(255,255,255,0.05); border:1px solid var(--line); padding:8px 16px; border-radius:30px; box-shadow:0 10px 40px rgba(0,0,0,0.4); }
    .composer input{ flex:1; background:transparent; border:none; outline:none; color:white; font-size:16px; padding:10px 0; }
    .icon-btn{ background:transparent; border:none; color:var(--muted); cursor:pointer; padding:8px; border-radius:50%; transition:0.2s; display:grid; place-items:center; }
    .icon-btn:hover{ color:var(--primary); background:rgba(255,255,255,0.05); }

    .send-btn{ background:var(--primary); color:var(--bg); width:40px; height:40px; border-radius:50%; border:none; cursor:pointer; display:grid; place-items:center; transition:0.3s; position: relative; }
    .send-btn:hover{ transform:scale(1.05); box-shadow:0 0 15px rgba(96,165,250,0.4); }
    .send-btn.stop { background: #EF4444; color: white; }
    .send-btn svg { transition: transform 0.2s; }

    /* Mobile Responsive */
    @media (max-width: 768px) {
      .app{ grid-template-columns: 1fr; }
      .sidebar{ display:none; }
      .composer-wrap {
        padding-bottom: calc(50px + env(safe-area-inset-bottom, 20px));
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo-box">
        <div class="logo">AO</div>
        <div class="logo-text">aiofeveryone</div>
      </div>

      <div class="sb-section">
        <div class="sb-title">최근 대화</div>
        <div id="historyList">
          <!-- 대화 목록이 여기에 동적으로 추가됨 -->
        </div>
      </div>

      <div style="margin-top:auto; font-size:12px; color:var(--muted);">
        Master: Kim Seon Jin<br/>© 2026 aiofeveryone.com
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-logo">
          <div class="topbar-icon">AO</div>
          <span>AOAI <span style="color:var(--primary)">01</span> HUB</span>
        </div>
        <div class="status-pill" id="netStatus">연결됨: Web Grid</div>
      </header>

      <div class="chat-container" id="chatLog">
        <div class="msg ai">안녕하세요. AOAI의 지능체 aoai01입니다. PC 환경에 최적화되어 연결되었습니다. 무엇을 도와드릴까요?</div>
      </div>

      <div class="composer-wrap">
        <div class="composer-box">
          <div class="composer">
            <button class="icon-btn" title="파일 첨부">📎</button>
            <input type="text" id="userInput" placeholder="무엇이든 물어보세요 (마스터 명령 가능)" autocomplete="off">
            <button class="icon-btn" id="voiceBtn">🎤</button>
            <button class="send-btn" id="sendBtn">
              <svg id="sendIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
              <svg id="stopIcon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display:none;">
                <rect x="4" y="4" width="16" height="16" rx="2"></rect>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const API_URL = "https://api.aiofeveryone.com/v1/chat";
    const chatLog = document.getElementById('chatLog');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const sendIcon = document.getElementById('sendIcon');
    const stopIcon = document.getElementById('stopIcon');
    const historyList = document.getElementById('historyList');

    let isGenerating = false;
    let typeInterval = null;
    let conversations = JSON.parse(localStorage.getItem('aoai_history') || '[]');

    // 초기화
    function init() {
      renderHistory();
      const deviceGrade = window.navigator.hardwareConcurrency >= 8 ? "S" : "A";
      // 시스템 메시지 자동 추가
      setTimeout(() => {
        addMessage('system', "📡 aoai01이 현재 웹 노드 자원을 분석하여 탈중앙화 그리드에 편입시켰습니다.");
      }, 3000);
    }

    // 대화 목록 렌더링
    function renderHistory() {
      historyList.innerHTML = '';
      conversations.slice(0, 20).forEach((conv, index) => {
        const item = document.createElement('div');
        item.className = 'history-item';
        item.innerHTML = `<div class="dot"></div><span>${conv.title}</span>`;
        item.onclick = () => loadConversation(index);
        historyList.appendChild(item);
      });
    }

    function saveHistory(title) {
      conversations.unshift({ title, date: new Date().toISOString() });
      if (conversations.length > 50) conversations.pop();
      localStorage.setItem('aoai_history', JSON.stringify(conversations));
      renderHistory();
    }

    function loadConversation(index) {
      // 실제 대화 내용을 복원하는 로직은 나중에 데이터 구조에 따라 구현
      alert(`'${conversations[index].title}' 대화 불러오기 기능은 준비 중입니다.`);
    }

    // 메시지 추가
    function addMessage(role, text) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `msg ${role}`;
      msgDiv.textContent = text;
      chatLog.appendChild(msgDiv);
      chatLog.scrollTop = chatLog.scrollHeight;
      return msgDiv;
    }

    // 타이핑 효과 중단
    function stopGeneration() {
      if (typeInterval) {
        clearInterval(typeInterval);
        typeInterval = null;
      }
      setGenerating(false);
    }

    function setGenerating(value) {
      isGenerating = value;
      if (isGenerating) {
        sendBtn.classList.add('stop');
        sendIcon.style.display = 'none';
        stopIcon.style.display = 'block';
      } else {
        sendBtn.classList.remove('stop');
        sendIcon.style.display = 'block';
        stopIcon.style.display = 'none';
      }
    }

    async function typeResponse(msgDiv, fullText) {
      msgDiv.textContent = "";
      let i = 0;
      typeInterval = setInterval(() => {
        if (i < fullText.length) {
          msgDiv.textContent += fullText[i];
          i++;
          chatLog.scrollTop = chatLog.scrollHeight;
        } else {
          stopGeneration();
        }
      }, 20);
    }

    // 3. 실제 API 전송 및 aoai01 연동
    async function handleAction() {
      if (isGenerating) {
        stopGeneration();
        return;
      }

      const text = userInput.value.trim();
      if (!text) return;

      setGenerating(true);
      addMessage('user', text);
      saveHistory(text.length > 15 ? text.substring(0, 15) + "..." : text);
      userInput.value = "";

      const aiMsgDiv = addMessage('ai', "...");

      try {
        const context = {
          userText: text,
          platformType: "WEB_PC",
          deviceGrade: window.navigator.hardwareConcurrency >= 8 ? "S" : "A",
          device: { browserInfo: navigator.userAgent },
          network: { isOnline: true, description: "Web High-Speed" }
        };

        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(context)
        });

        if (!isGenerating) return; // 전송 중 중단된 경우

        const data = await response.json();
        await typeResponse(aiMsgDiv, data.finalText || "응답을 가져오지 못했습니다.");

      } catch (e) {
        aiMsgDiv.textContent = "연결 오류가 발생했습니다. Cloudflare 프록시 상태를 확인해 주세요.";
        setGenerating(false);
      }
    }

    sendBtn.onclick = handleAction;
    userInput.onkeydown = (e) => { if(e.key === 'Enter') handleAction(); };

    init();
  </script>
</body>
</html>
