<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0F19" />
  <title>AOAI 01 - Internal Intelligence</title>
  <style>
    :root{ --bg:#0B0F19; --text:#E5E7EB; --primary:#60A5FA; --line:rgba(255,255,255,.08); }
    body{ margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,sans-serif; display:flex; flex-direction:column; height:100vh; overflow:hidden; }
    .header { padding: 16px; border-bottom: 1px solid var(--line); font-weight: 900; letter-spacing: 1px; text-align: center; }
    .chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    .msg { max-width: 85%; padding: 12px 16px; border-radius: 16px; font-size: 15px; line-height: 1.5; }
    .msg.ai { align-self: flex-start; background: rgba(255,255,255,0.05); border: 1px solid var(--line); }
    .msg.user { align-self: flex-end; background: var(--primary); color: #000; }

    /* 입력 영역 수정: 하단 여백 추가로 동작 버튼과 겹침 방지 */
    .input-area {
      padding: 20px;
      padding-bottom: calc(40px + env(safe-area-inset-bottom, 20px));
      border-top: 1px solid var(--line);
      display: flex;
      gap: 10px;
      background: var(--bg);
    }

    input { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--line); border-radius: 24px; padding: 12px 20px; color: white; outline: none; }
    button { background: var(--primary); border: none; border-radius: 50%; width: 44px; height: 44px; cursor: pointer; display: grid; place-items: center; }
  </style>
</head>
<body>
  <div class="header">AOAI <span style="color:var(--primary)">01</span> INTERNAL</div>
  <div class="chat" id="chat">
    <div class="msg ai">시스템이 정상화되었습니다. 현재 디바이스의 자원을 최적화하여 aoai01 지능을 가동합니다.</div>
  </div>
  <div class="input-area">
    <input type="text" id="in" placeholder="명령을 입력하세요..." autocomplete="off">
    <button id="go">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
    </button>
  </div>
  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('in');
    const btn = document.getElementById('go');

    function add(role, txt) {
      const d = document.createElement('div');
      d.className = 'msg ' + role;
      d.textContent = txt;
      chat.appendChild(d);
      chat.scrollTop = chat.scrollHeight;
    }

    async function send() {
      const t = input.value.trim();
      if(!t) return;
      add('user', t);
      input.value = '';
      if(window.AOAI) { window.AOAI.postMessage(t); }
    }
    btn.onclick = send;
    input.onkeydown = (e) => { if(e.key==='Enter') send(); };
  </script>
</body>
</html>
